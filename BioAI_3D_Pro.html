<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioAI 3D Pro — बायोलॉजी लर्निंग ऐप</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1e293b; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    header h1 { margin: 0; font-size: 18px; color: #38bdf8; }
    .api-bar { display: flex; gap: 6px; }
    .api-bar input { padding: 6px 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 13px; width: 180px; }
    .api-bar button { padding: 6px 12px; border-radius: 6px; border: none; background: #0284c7; color: #fff; cursor: pointer; font-size: 13px; }
    .main { display: flex; flex: 1; overflow: hidden; }
    .chat-panel { flex: 1.2; display: flex; flex-direction: column; border-right: 1px solid #334155; }
    .messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 14.5px; white-space: pre-line; }
    .msg img { max-width: 180px; border-radius: 8px; display: block; margin-bottom: 6px; }
    .user { align-self: flex-end; background: #0284c7; color: #fff; }
    .bot { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 8px; }
    .chip { background: #1e293b; border: 1px solid #38bdf8; color: #7dd3fc; padding: 5px 10px; border-radius: 999px; font-size: 12.5px; cursor: pointer; }
    .preview-bar { padding: 6px 14px; background: #1e293b; font-size: 12px; color: #34d399; display: none; justify-content: space-between; align-items: center; }
    .input-box { display: flex; gap: 6px; padding: 10px 14px; background: #1e293b; border-top: 1px solid #334155; align-items: center; }
    .img-btn { background: #334155; color: #fff; border: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 16px; }
    .input-box input[type="text"] { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; }
    .send-btn { padding: 10px 16px; border-radius: 8px; border: none; background: #10b981; color: #052e16; font-weight: 700; cursor: pointer; }
    .visual-panel { flex: 1; display: flex; flex-direction: column; padding: 14px; gap: 12px; overflow-y: auto; background: #0b1120; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; }
    .card h3 { margin: 0 0 8px; font-size: 14.5px; color: #34d399; }
    model-viewer { width: 100%; height: 240px; background: #0f172a; border-radius: 10px; }
    .diagram-box { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; font-size: 13.5px; color: #cbd5e1; }
    .diagram-box svg { width: 100%; max-height: 150px; margin-bottom: 8px; }
    @media (max-width: 800px) {
      .main { flex-direction: column; }
      .chat-panel { border-right: none; border-bottom: 1px solid #334155; height: 56%; }
      .visual-panel { height: 44%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🧬 BioAI 3D Pro</h1>
    <div class="api-bar">
      <input id="apiKey" type="password" placeholder="Gemini API Key डालें" />
      <button onclick="saveKey()">सेव</button>
    </div>
  </header>

  <div class="main">
    <div class="chat-panel">
      <div class="messages" id="messages">
        <div class="msg bot">नमस्ते! कोई भी बायोलॉजी सवाल पूछें, 📷 बटन से किताब के डायग्राम की फ़ोटो भेजें, या "3D में दिखाओ" लिखें।</div>
      </div>

      <div class="chips">
        <button class="chip" onclick="quickAsk('दिल कैसे काम करता है, 3D में दिखाओ')">दिल (Heart) 3D</button>
        <button class="chip" onclick="quickAsk('कोशिका (Cell) का डायग्राम और भाग समझाओ')">कोशिका डायग्राम</button>
        <button class="chip" onclick="quickAsk('DNA की संरचना समझाओ')">DNA संरचना</button>
      </div>

      <div class="preview-bar" id="previewBar">
        <span id="fileName">फ़ोटो चुनी गई</span>
        <button onclick="clearImage()" style="background:none;border:none;color:#f87171;cursor:pointer;">हटाएँ ✖</button>
      </div>

      <div class="input-box">
        <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImage(event)" />
        <button class="img-btn" title="फ़ोटो अपलोड करें" onclick="document.getElementById('imageInput').click()">📷</button>
        <input id="userInput" type="text" placeholder="सवाल लिखें या फ़ोटो के बारे में पूछें..." onkeydown="if(event.key==='Enter') sendMessage()" />
        <button class="send-btn" onclick="sendMessage()">भेजें</button>
      </div>
    </div>

    <div class="visual-panel">
      <div class="card">
        <h3>🧊 इंटरैक्टिव 3D व्यूअर</h3>
        <model-viewer
          id="viewer3d"
          src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
          alt="3D Biology Model"
          camera-controls
          auto-rotate>
        </model-viewer>
      </div>

      <div class="card">
        <h3>🖼️ डायग्राम और मुख्य लेबल</h3>
        <div class="diagram-box" id="diagramBox">
          किसी टॉपिक का नाम लिखें, यहाँ उसका डायग्राम और लेबल दिखेगा।
        </div>
      </div>
    </div>
  </div>

  <script>
    const MODELS = {
      heart: "https://modelviewer.dev/shared-assets/models/Astronaut.glb", // यहाँ Heart .glb लिंक डालें
      cell: "https://modelviewer.dev/shared-assets/models/Astronaut.glb"   // यहाँ Cell .glb लिंक डालें
    };

    const DIAGRAMS = {
      cell: `
        <svg viewBox="0 0 300 140">
          <ellipse cx="150" cy="70" rx="120" ry="55" fill="#1e3a8a" stroke="#38bdf8" stroke-width="3"/>
          <circle cx="150" cy="70" r="24" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/>
          <ellipse cx="85" cy="60" rx="18" ry="9" fill="#059669" stroke="#6ee7b7"/>
          <text x="150" y="74" fill="#fff" font-size="10" text-anchor="middle">केंद्रक</text>
          <text x="85" y="45" fill="#6ee7b7" font-size="10" text-anchor="middle">माइटोकॉन्ड्रिया</text>
          <text x="235" y="30" fill="#7dd3fc" font-size="10">कोशिका झिल्ली</text>
        </svg>
        <div><b>कोशिका (Cell):</b> केंद्रक (नियंत्रण), माइटोकॉन्ड्रिया (ऊर्जा), कोशिका झिल्ली (सुरक्षा)।</div>`,
      heart: `
        <svg viewBox="0 0 300 140">
          <rect x="75" y="20" width="70" height="45" rx="8" fill="#1d4ed8" stroke="#93c5fd"/>
          <rect x="155" y="20" width="70" height="45" rx="8" fill="#b91c1c" stroke="#fca5a5"/>
          <rect x="75" y="70" width="70" height="50" rx="8" fill="#1e40af" stroke="#93c5fd"/>
          <rect x="155" y="70" width="70" height="50" rx="8" fill="#991b1b" stroke="#fca5a5"/>
          <text x="110" y="46" fill="#fff" font-size="10" text-anchor="middle">दायाँ आलिंद</text>
          <text x="190" y="46" fill="#fff" font-size="10" text-anchor="middle">बायाँ आलिंद</text>
          <text x="110" y="98" fill="#fff" font-size="10" text-anchor="middle">दायाँ निलय</text>
          <text x="190" y="98" fill="#fff" font-size="10" text-anchor="middle">बायाँ निलय</text>
        </svg>
        <div><b>मानव हृदय:</b> दायाँ हिस्सा अशुद्ध रक्त फेफड़ों में भेजता है, बायाँ हिस्सा शुद्ध रक्त शरीर में पंप करता है।</div>`
    };

    let geminiKey = localStorage.getItem("bio_gemini_key") || "";
    if (geminiKey) document.getElementById("apiKey").value = geminiKey;

    let selectedImageBase64 = null;
    let selectedMimeType = null;
    let selectedPreviewUrl = null;

    function saveKey() {
      geminiKey = document.getElementById("apiKey").value.trim();
      localStorage.setItem("bio_gemini_key", geminiKey);
      addMsg("API Key सेव हो गई! अब आप फ़ोटो और टेक्स्ट दोनों से लाइव सवाल पूछ सकते हैं।", "bot");
    }

    function handleImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      selectedMimeType = file.type;
      const reader = new FileReader();
      reader.onload = () => {
        selectedPreviewUrl = reader.result;
        selectedImageBase64 = reader.result.split(",")[1];
        document.getElementById("fileName").textContent = `📷 ${file.name}`;
        document.getElementById("previewBar").style.display = "flex";
      };
      reader.readAsDataURL(file);
    }

    function clearImage() {
      selectedImageBase64 = null;
      selectedMimeType = null;
      selectedPreviewUrl = null;
      document.getElementById("imageInput").value = "";
      document.getElementById("previewBar").style.display = "none";
    }

    function addMsg(text, sender, imgUrl = null) {
      const box = document.getElementById("messages");
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      if (imgUrl) {
        const img = document.createElement("img");
        img.src = imgUrl;
        div.appendChild(img);
      }
      const span = document.createElement("span");
      span.textContent = text;
      div.appendChild(span);
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return span;
    }

    function updateVisuals(query) {
      const q = query.toLowerCase();
      const diag = document.getElementById("diagramBox");
      const viewer = document.getElementById("viewer3d");

      if (q.includes("दिल") || q.includes("heart")) {
        diag.innerHTML = DIAGRAMS.heart;
        if (q.includes("3d")) viewer.src = MODELS.heart;
      } else if (q.includes("कोशिका") || q.includes("cell")) {
        diag.innerHTML = DIAGRAMS.cell;
        if (q.includes("3d")) viewer.src = MODELS.cell;
      }
    }

    async function askGemini(prompt, imgBase64, mimeType) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(geminiKey)}`;
      const parts = [{ text: prompt || "इस बायोलॉजी डायग्राम या प्रश्न को हिंदी में विस्तार से समझाएँ।" }];
      if (imgBase64) {
        parts.push({ inline_data: { mime_type: mimeType, data: imgBase64 } });
      }

      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          systemInstruction: {
            parts: [{ text: "आप एक विशेषज्ञ बायोलॉजी शिक्षक हैं। हिंदी में सरल, बिंदुवार और परीक्षा-उपयोगी उत्तर दें।" }]
          },
          contents: [{ parts }]
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || "API त्रुटि");
      return data.candidates?.[0]?.content?.parts?.[0]?.text || "कोई उत्तर नहीं मिला।";
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text && !selectedImageBase64) return;

      const currentImg = selectedImageBase64;
      const currentMime = selectedMimeType;
      const currentPreview = selectedPreviewUrl;

      input.value = "";
      clearImage();

      addMsg(text || "इस डायग्राम को समझाओ", "user", currentPreview);
      updateVisuals(text);

      const botTextSpan = addMsg("विश्लेषण कर रहा हूँ...", "bot");

      try {
        if (!geminiKey) {
          botTextSpan.textContent = "लाइव AI और फ़ोटो विश्लेषण के लिए ऊपर अपनी Gemini API Key सेव करें। तब तक ऊपर के बटन ('दिल 3D', 'कोशिका डायग्राम') से डेमो देखें।";
          return;
        }
        const reply = await askGemini(text, currentImg, currentMime);
        botTextSpan.textContent = reply;
      } catch (err) {
        botTextSpan.textContent = `त्रुटि: ${err.message}`;
      }
    }

    function quickAsk(q) {
      document.getElementById("userInput").value = q;
      sendMessage();
    }
  </script>
</body>
</html>
